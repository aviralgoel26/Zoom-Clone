# render.yaml — Render 100% Free Tier Blueprint
# -----------------------------------------------
# Deploys Zoom Clone on Render's FREE tier without requiring credit card or payment.

services:
  # ── 1. FastAPI Backend Service (100% Free Tier) ───────────────────────────
  - type: web
    name: zoom-clone-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true

  # ── 2. Next.js Frontend Service (100% Free Tier) ──────────────────────────
  - type: web
    name: zoom-clone-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: zoom-clone-backend
          property: host
